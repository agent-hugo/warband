<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Warband</title>
    <script>
      // The page itself may be cached for a few minutes while a new release has
      // already replaced the hashed bundle it points to. If a bundle fails to
      // load, fetch the page past the cache and reload once (not more often
      // than every 30 seconds, so a real outage does not loop).
      addEventListener(
        'error',
        function (e) {
          var el = e.target;
          var src = el && (el.src || el.href);
          if (!src || !/\/assets\//.test(src)) return;
          try {
            var last = +sessionStorage.getItem('reloadedAt') || 0;
            if (Date.now() - last < 30000) return;
            sessionStorage.setItem('reloadedAt', String(Date.now()));
          } catch (_) {
            return;
          }
          fetch(location.href, { cache: 'reload' }).then(
            function () { location.reload(); },
            function () { location.reload(); }
          );
        },
        true
      );
    </script>
    <script>
      // Old invite links and QR codes point here with the room in the hash: pass them on to the game.
      if (location.hash.length > 1) location.replace('fogtag/' + location.hash);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 16px;
        background: #1f2430; color: #e8e8e8; font: 18px system-ui, sans-serif; text-align: center; }
      h1 { margin: 0; font-size: 28px; }
      a { display: block; padding: 16px 24px; border-radius: 12px; background: #2f3747;
        color: inherit; text-decoration: none; }
      a:active { background: #3b4559; }
      small { display: block; margin-top: 4px; opacity: 0.7; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>Warband</h1>
    <a href="fogtag/">🌫️ Догонялки в тумане<small>водящий быстрее, видно только рядом</small></a>
  </body>
</html>
